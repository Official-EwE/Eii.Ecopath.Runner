name: Create Release and Docker Image

on:
  push:
    branches:
      - master

permissions:
  contents: write
  packages: write

concurrency:
  group: create-release-and-docker
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      IMAGE: ghcr.io/official-ewe/eiiecopathrunnerrunprocess

    steps:
      # Full clone required by GitVersion to walk the commit history and compute the version.
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install GitVersion
        uses: gittools/actions/gitversion/setup@v4.1.0
        with:
          versionSpec: '6.4.0'

      # Calculate one version for the console release, Docker image and git tag.
      # Patch auto-increments; use '+semver: minor' or '+semver: major' for higher bumps.
      - name: Run GitVersion
        id: gitversion
        uses: gittools/actions/gitversion/execute@v4.1.0
        with:
          overrideConfig: |
            workflow=TrunkBased/preview1
            tag-prefix=v

      - name: Show version
        run: echo "Building version ${{ steps.gitversion.outputs.semVer }}"
        shell: bash

      - name: Ensure github-Official-EwE NuGet source
        run: |
          if dotnet nuget list source | grep -q "github-Official-EwE"; then
            dotnet nuget remove source github-Official-EwE
          fi
          dotnet nuget add source "https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json" \
            --name "github-Official-EwE" \
            --username ${{ github.repository_owner }} \
            --password ${{ github.token }} \
            --store-password-in-clear-text
        shell: bash

      - name: List NuGet data sources
        run: dotnet nuget list source --format detailed
        shell: bash

      - name: Restore
        run: dotnet restore Eii.Ecopath.Runner.Console/EwERunConsole.csproj
        shell: bash

      # Documentation generation uses reflection; no model file is required.
      - name: Generate documentation
        run: dotnet run --project Eii.Ecopath.Runner.Console/EwERunConsole.csproj --no-restore -- --docs
        shell: bash

      - name: Convert documentation to PDF
        uses: docker://pandoc/latex:edge
        with:
          args: >-
            ~Documentation/automation-commands.md
            --pdf-engine=xelatex
            -o ~Documentation/automation-commands.pdf

      - name: Publish console
        run: >
          dotnet publish Eii.Ecopath.Runner.Console/EwERunConsole.csproj
          --configuration Release
          --runtime win-x64
          --self-contained false
          --output publish/EwERunConsole
          /p:Version=${{ steps.gitversion.outputs.semVer }}
          /p:AssemblyVersion=${{ steps.gitversion.outputs.assemblySemVer }}
          /p:FileVersion=${{ steps.gitversion.outputs.assemblySemFileVer }}
        shell: bash

      - name: Create ZIP
        shell: bash
        run: |
          mkdir -p publish/EwERunConsole/~Documentation
          cp ~Documentation/automation-commands.md publish/EwERunConsole/~Documentation/
          cp ~Documentation/automation-commands.pdf publish/EwERunConsole/~Documentation/
          cd publish/EwERunConsole
          zip -r ../../EwERunConsole-${{ steps.gitversion.outputs.semVer }}.zip .

      - name: Log in to GHCR
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: echo "$GITHUB_TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
        shell: bash

      - name: Build Docker image
        env:
          GITHUB_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.gitversion.outputs.semVer }}
        run: |
          docker build \
            -f Eii.Ecopath.Runner.RunProcess/Dockerfile \
            --secret id=GITHUB_TOKEN,env=GITHUB_TOKEN \
            --label "org.opencontainers.image.source=https://github.com/${{ github.repository }}" \
            --label "org.opencontainers.image.version=$VERSION" \
            --label "org.opencontainers.image.revision=${{ github.sha }}" \
            -t "$IMAGE:$VERSION" \
            -t "$IMAGE:latest" \
            .
        shell: bash

      - name: Push Docker image
        env:
          VERSION: ${{ steps.gitversion.outputs.semVer }}
        run: |
          docker push "$IMAGE:$VERSION"
          docker push "$IMAGE:latest"
        shell: bash

      - name: Create tag
        shell: bash
        run: |
          TAG=v${{ steps.gitversion.outputs.semVer }}

          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists, skipping"
          else
            git tag "$TAG"
            git push origin "$TAG"
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.gitversion.outputs.semVer }}
          name: EwERunConsole v${{ steps.gitversion.outputs.semVer }}
          body: |
            Automated release of EwERunConsole version ${{ steps.gitversion.outputs.semVer }}.

            EwERunProcess Docker image: ghcr.io/official-ewe/eiiecopathrunnerrunprocess:${{ steps.gitversion.outputs.semVer }}
          files: |
            EwERunConsole-${{ steps.gitversion.outputs.semVer }}.zip
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
