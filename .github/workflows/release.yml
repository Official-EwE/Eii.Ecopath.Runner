name: Build and Release

# Triggers on every push to master, which represents a completed piece of work on the trunk.
on:
  push:
    branches:
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # Full clone required by GitVersion to walk the commit history and compute the version.
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      # Install the GitVersion CLI tool at the pinned version so the version calculation is reproducible.
      - name: Install GitVersion
        uses: gittools/actions/gitversion/setup@v4.1.0
        with:
          versionSpec: '6.4.0'

      # Calculate the semantic version from the git history.
      # - workflow=TrunkBased/preview1: trunk-based development mode; master is the mainline branch,
      #   patch is auto-incremented on every commit. Use '+semver: minor' or '+semver: major' in a
      #   merge/commit message to force a higher bump.
      # - tag-prefix=v: matches existing tags of the form vX.Y.Z.
      - name: Run GitVersion
        id: gitversion
        uses: gittools/actions/gitversion/execute@v4.1.0
        with:
          overrideConfig: |
            workflow=TrunkBased/preview1
            tag-prefix=v

      - name: Show version
        run: echo "Building version ${{ steps.gitversion.outputs.semVer }}"
        shell: bash

      # Register the private GitHub NuGet feed that hosts the EwE engine packages.
      # The standard GITHUB_TOKEN is used so no extra secret needs to be configured.
      # The source is removed first (if present) to avoid duplicate-source errors on re-runs.
      - name: Ensure github-Official-EwE NuGet source
        run: |
          if dotnet nuget list source | grep -q "github-Official-EwE"; then
            dotnet nuget remove source github-Official-EwE
          fi
          dotnet nuget add source "https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json" \
            --name "github-Official-EwE" \
            --username ${{ github.repository_owner }} \
            --password ${{ github.token }} \
            --store-password-in-clear-text
        shell: bash

      # Diagnostic step: print the active NuGet sources so feed resolution issues are easy to spot in the log.
      - name: List NuGet data sources
        run: dotnet nuget list source --format detailed
        shell: bash

      - name: Restore
        run: dotnet restore Eii.Ecopath.Runner.Console/EwERunConsole.csproj
        shell: bash

      # Publish a framework-dependent win-x64 binary.
      # Version properties are injected so the compiled assembly carries the correct version metadata.
      - name: Publish
        run: >
          dotnet publish Eii.Ecopath.Runner.Console/EwERunConsole.csproj
          --configuration Release
          --runtime win-x64
          --self-contained false
          --output publish/EwERunConsole
          /p:Version=${{ steps.gitversion.outputs.semVer }}
          /p:AssemblyVersion=${{ steps.gitversion.outputs.assemblySemVer }}
          /p:FileVersion=${{ steps.gitversion.outputs.assemblySemFileVer }}
        shell: bash

      # cd into the output directory first so the ZIP contains files at its root,
      # rather than nested under publish/EwERunConsole/.
      - name: Create ZIP
        shell: bash
        run: |
          cd publish/EwERunConsole
          zip -r ../../EwERunConsole-${{ steps.gitversion.outputs.semVer }}.zip .

      # Push the version tag to the remote so GitVersion can find it on the next run.
      # The existence check prevents the step from failing when the workflow is re-run
      # for the same commit (e.g. after a transient failure in a later step).
      - name: Create tag
        shell: bash
        run: |
          TAG=v${{ steps.gitversion.outputs.semVer }}

          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists, skipping"
          else
            git tag $TAG
            git push origin $TAG
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.gitversion.outputs.semVer }}
          name: EwERunConsole v${{ steps.gitversion.outputs.semVer }}
          body: Automated release of EwERunConsole version ${{ steps.gitversion.outputs.semVer }}.
          files: EwERunConsole-${{ steps.gitversion.outputs.semVer }}.zip
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}